[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --basetemp=.test-artifacts"
cache_dir = ".test-cache/pytest"
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 3
markers = [
    "performance: deterministic wall-time and memory budget checks",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
