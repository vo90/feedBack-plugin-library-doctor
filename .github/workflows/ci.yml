name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m ruff check validator.py scanner.py repair.py batch_repair.py migration.py routes.py tests
      - run: python -m pytest --cov --cov-report=term
      - run: python -m py_compile validator.py scanner.py repair.py batch_repair.py migration.py routes.py
      - run: node --check screen.js
